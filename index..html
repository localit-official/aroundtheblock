<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA 오늘의 우주 사진 (APOD)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    .space-gradient {
      background: radial-gradient(circle at top, #1e293b 0%, #0b0f19 100%);
    }
    .glass-card {
      background: rgba(22, 31, 48, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="space-gradient min-h-screen flex flex-col items-center p-4 md:p-8">

  <header class="w-full max-w-4xl text-center mb-8">
    <div class="inline-flex items-center gap-3 mb-2">
      <i class="fa-solid font-bold text-3xl text-sky-400 fa-user-astronaut"></i>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">NASA APOD Viewer</h1>
    </div>
    <p class="text-slate-400 text-sm md:text-base">NASA의 오늘의 우주 사진(Astronomy Picture of the Day)을 탐색해 보세요.</p>
  </header>

  <!-- Control Panel -->
  <div class="w-full max-w-4xl glass-card rounded-2xl p-4 mb-6 flex flex-wrap items-center justify-between gap-4 shadow-xl">
    <div class="flex items-center gap-3 w-full sm:w-auto">
      <label for="apod-date-picker" class="text-sm font-semibold text-slate-300 flex items-center gap-2">
        <i class="fa-regular fa-calendar-days text-sky-400"></i> 날짜 선택:
      </label>
      <input type="date" id="apod-date-picker" class="bg-slate-900 text-white border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 color-scheme-dark cursor-pointer">
    </div>

    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
      <button id="btn-today" class="flex-1 sm:flex-initial bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-4 py-2 rounded-lg transition-all flex items-center justify-center gap-2 border border-slate-700">
        <i class="fa-solid fa-clock-rotate-left"></i> 오늘 사진
      </button>
      <button id="btn-random" class="flex-1 sm:flex-initial bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm px-4 py-2 rounded-lg transition-all flex items-center justify-center gap-2 shadow-lg shadow-sky-500/20">
        <i class="fa-solid fa-shuffle"></i> 랜덤 탐색
      </button>
    </div>
  </div>

  <main class="w-full max-w-4xl glass-card rounded-2xl overflow-hidden shadow-2xl">
    <!-- Media Container (Image / Video) -->
    <div id="media-container" class="w-full min-h-[350px] bg-black flex items-center justify-center relative overflow-hidden border-b border-slate-800">
      <div class="flex flex-col items-center gap-3 text-slate-400 py-16">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-sky-400"></i>
        <p class="text-sm">우주 데이터를 불러오는 중...</p>
      </div>
    </div>

    <!-- Content Details -->
    <div class="p-6 md:p-8">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <span id="apod-date" class="text-xs font-bold tracking-wider text-sky-400 uppercase bg-sky-950/60 border border-sky-800 px-3 py-1 rounded-full">
          YYYY-MM-DD
        </span>
        <span id="apod-copyright" class="text-xs text-slate-400 italic"></span>
      </div>

      <h2 id="apod-title" class="text-2xl md:text-3xl font-bold text-white mb-4 leading-snug">
        불러오는 중...
      </h2>

      <p id="apod-explanation" class="text-slate-300 text-sm md:text-base leading-relaxed mb-6 whitespace-pre-line font-light">
        잠시만 기다려 주세요.
      </p>

      <div class="flex flex-wrap items-center gap-3 pt-4 border-t border-slate-800/80">
        <a id="btn-hd" href="#" target="_blank" rel="noopener noreferrer" class="hidden bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-sm px-5 py-2.5 rounded-lg transition-all items-center gap-2 shadow-lg shadow-sky-500/20">
          <i class="fa-solid fa-up-right-and-down-left-from-center"></i> 고해상도 원본 보기
        </a>
        <a id="btn-nasa-link" href="#" target="_blank" rel="noopener noreferrer" class="hidden bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium px-5 py-2.5 rounded-lg transition-all items-center gap-2 border border-slate-700">
          <i class="fa-solid fa-globe"></i> NASA APOD 공식 페이지
        </a>
      </div>
    </div>
  </main>

  <script>
    // NASA API Key provided by user
    const API_KEY = 'Qg0zYyUlZANr4Ngbq1V9ORk4vib6wgVyQG63FLDC';
    const APOD_START_DATE = '1995-06-16';

    // DOM Elements
    const datePicker = document.getElementById('apod-date-picker');
    const mediaContainer = document.getElementById('media-container');
    const titleEl = document.getElementById('apod-title');
    const dateEl = document.getElementById('apod-date');
    const copyrightEl = document.getElementById('apod-copyright');
    const explanationEl = document.getElementById('apod-explanation');
    const btnHd = document.getElementById('btn-hd');
    const btnNasaLink = document.getElementById('btn-nasa-link');
    const btnToday = document.getElementById('btn-today');
    const btnRandom = document.getElementById('btn-random');

    // Get today's date formatted (YYYY-MM-DD)
    const getTodayDateStr = () => {
      const today = new Date();
      return today.toISOString().split('T')[0];
    };

    // Initialize Date Picker Bounds
    const todayStr = getTodayDateStr();
    datePicker.min = APOD_START_DATE;
    datePicker.max = todayStr;
    datePicker.value = todayStr;

    // Fetch NASA APOD Data
    async function fetchAPOD(date) {
      // Set Loading UI
      mediaContainer.innerHTML = `
        <div class="flex flex-col items-center gap-3 text-slate-400 py-16">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl text-sky-400"></i>
          <p class="text-sm">우주 데이터를 불러오는 중...</p>
        </div>
      `;
      titleEl.textContent = '불러오는 중...';
      explanationEl.textContent = '데이터를 받아오고 있습니다.';
      copyrightEl.textContent = '';
      btnHd.classList.add('hidden');
      btnHd.classList.remove('inline-flex');
      btnNasaLink.classList.add('hidden');
      btnNasaLink.classList.remove('inline-flex');

      try {
        const response = await fetch(`https://api.nasa.gov/planetary/apod?api_key=${API_KEY}&date=${date}`);
        
        if (!response.ok) {
          throw new Error(`API Error: ${response.status}`);
        }

        const data = await response.json();

        // Update Text Info
        dateEl.textContent = data.date;
        titleEl.textContent = data.title || '제목 없음';
        explanationEl.textContent = data.explanation || '설명이 제공되지 않았습니다.';
        
        if (data.copyright) {
          copyrightEl.textContent = `© ${data.copyright.trim()}`;
        }

        // Render Media
        if (data.media_type === 'image') {
          mediaContainer.innerHTML = `
            <img 
              src="${data.url}" 
              alt="${data.title}" 
              class="w-full h-auto max-h-[700px] object-contain transition-all duration-300"
              onerror="this.src='https://placehold.co/800x500/0b0f19/f1f5f9?text=Image+Load+Failed'"
            />
          `;

          if (data.hdurl) {
            btnHd.href = data.hdurl;
            btnHd.classList.remove('hidden');
            btnHd.classList.add('inline-flex');
          }
        } else if (data.media_type === 'video') {
          mediaContainer.innerHTML = `
            <div class="w-full aspect-video">
              <iframe src="${data.url}" class="w-full h-full" frameborder="0" allowfullscreen></iframe>
            </div>
          `;
        } else {
          mediaContainer.innerHTML = `
            <div class="p-8 text-center text-slate-400">
              지원되지 않는 미디어 형식입니다.
            </div>
          `;
        }

        // Official NASA Web Link
        const dateCode = data.date.replace(/-/g, '').slice(2);
        btnNasaLink.href = `https://apod.nasa.gov/apod/ap${dateCode}.html`;
        btnNasaLink.classList.remove('hidden');
        btnNasaLink.classList.add('inline-flex');

      } catch (error) {
        console.error(error);
        mediaContainer.innerHTML = `
          <div class="flex flex-col items-center gap-3 text-rose-400 py-12 px-4 text-center">
            <i class="fa-solid fa-triangle-exclamation text-3xl"></i>
            <p class="font-semibold">데이터를 불러오지 못했습니다.</p>
            <p class="text-xs text-slate-400">네트워크 상태를 확인하거나 다른 날짜를 선택해 보세요.</p>
          </div>
        `;
        titleEl.textContent = '오류 발생';
        explanationEl.textContent = '해당 날짜의 우주 정보를 불러오는 중 문제가 발생했습니다.';
      }
    }

    function getRandomDate() {
      const start = new Date(APOD_START_DATE).getTime();
      const end = new Date().getTime();
      const randomTime = start + Math.random() * (end - start);
      const randomDate = new Date(randomTime);
      return randomDate.toISOString().split('T')[0];
    }

    // Event Listeners
    datePicker.addEventListener('change', (e) => {
      if (e.target.value) {
        fetchAPOD(e.target.value);
      }
    });

    btnToday.addEventListener('click', () => {
      const today = getTodayDateStr();
      datePicker.value = today;
      fetchAPOD(today);
    });

    btnRandom.addEventListener('click', () => {
      const randomDate = getRandomDate();
      datePicker.value = randomDate;
      fetchAPOD(randomDate);
    });

    // Initial Load
    window.onload = () => {
      fetchAPOD(todayStr);
    };
  </script>
</body>
</html>
